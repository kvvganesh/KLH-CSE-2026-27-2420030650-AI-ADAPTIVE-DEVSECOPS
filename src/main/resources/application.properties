spring.application.name=adaptive-devsecops
server.port=8081
spring.thymeleaf.cache=false
server.error.include-stacktrace=never
server.error.include-message=never

# Risk thresholds (see Settings page)
devsecops.risk.medium-threshold=30
devsecops.risk.high-threshold=60

# Live local scan (Scan mode = "Live local scan")
# workspace blank = <user home>/.adaptive-devsecops/workspaces
devsecops.scan.workspace=
devsecops.scan.gitleaks-command=gitleaks
# maven-command blank = "mvn" (mvn.cmd on Windows)
devsecops.scan.maven-command=
devsecops.scan.timeout-minutes=15
# OWASP Dependency-Check: the first run downloads the NVD database (very slow without an API key)
devsecops.scan.dependency-check-enabled=false
devsecops.scan.dependency-check-timeout-minutes=60
devsecops.scan.nvd-api-key=${NVD_API_KEY:}
# SonarQube: set SONAR_HOST_URL and SONAR_TOKEN environment variables to enable
devsecops.scan.sonar-url=${SONAR_HOST_URL:}
devsecops.scan.sonar-token=${SONAR_TOKEN:}
